          }
        },
        {
          "name": "tags",
          "label": "Tags",
          "type": "string",
          "list": true,
          "default": []
        },
        {
          "name": "cover",
          "label": "Cover image",
          "type": "image",
          "options": {
            "media": "images"
          },
          "description": "JPG, PNG, WebP or AVIF; maximum 2 MiB."
        },
        {
          "name": "coverAlt",
          "label": "Image description",
