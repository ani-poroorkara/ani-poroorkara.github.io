        }
      ]
    },
    {
      "name": "site",
      "label": "Site settings",
      "type": "file",
      "path": "src/data/site.json",
      "format": "json",
      "operations": {
        "create": false,
        "rename": false,
        "delete": false
      },
      "fields": [
        {
          "name": "name",
          "label": "Name",
          "type": "string",
          "required": true
        },
        {
          "name": "headline",
          "label": "Headline",
          "type": "string",
          "required": true
        },
        {
          "name": "bio",
          "label": "About me",
          "type": "text",
          "required": true
        },
        {
          "name": "contactEmail",
          "label": "Contact email",
          "type": "string",
          "required": true
        },
        {
          "name": "availability",
          "label": "Contact invitation",
          "type": "text"
        },
        {
          "name": "socials",
          "label": "Social links",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "label",
              "label": "Label",
              "type": "string",
              "required": true
            },
            {
              "name": "url",
              "label": "HTTPS URL",
              "type": "string",
              "required": true
            }
          ]
        },
        {
          "name": "seoDescription",
          "label": "Search description",
          "type": "text",
          "required": true
        },
        {
          "name": "socialImage",
          "label": "Social preview image",
          "type": "image",
          "options": {
            "media": "images"
          },
          "description": "Optional uploaded preview; otherwise the default brand card is used."
        }
      ]
    },
    {
      "name": "resume",
      "label": "Résumé",
      "type": "file",
      "path": "src/data/resume.json",
      "format": "json",
      "operations": {
        "create": false,
        "rename": false,
        "delete": false
      },
      "fields": [
        {
          "name": "summary",
          "label": "Professional summary",
          "type": "text"
        },
        {
          "name": "experience",
          "label": "Experience",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "organization",
              "label": "Organization",
              "type": "string",
              "required": true
            },
            {
              "name": "role",
              "label": "Role",
              "type": "string",
              "required": true
            },
            {
              "name": "start",
              "label": "Start month",
              "type": "string",
              "description": "YYYY-MM, for example 2026-10. Leave end empty for a current role."
            },
            {
              "name": "end",
              "label": "End month",
              "type": "string",
              "description": "YYYY-MM, for example 2026-10. Leave end empty for a current role."
            },
            {
              "name": "location",
              "label": "Location",
              "type": "string"
            },
            {
              "name": "highlights",
              "label": "Highlights",
              "type": "text",
              "list": true,
              "default": []
            }
          ]
        },
        {
          "name": "education",
          "label": "Education",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "institution",
              "label": "Institution",
              "type": "string",
              "required": true
            },
            {
              "name": "qualification",
              "label": "Qualification",
              "type": "string",
              "required": true
            },
            {
              "name": "start",
              "label": "Start month",
              "type": "string",
              "description": "YYYY-MM, for example 2026-10. Leave end empty for a current role."
            },
            {
              "name": "end",
              "label": "End month",
              "type": "string",
              "description": "YYYY-MM, for example 2026-10. Leave end empty for a current role."
            }
          ]
        },
        {
          "name": "skills",
          "label": "Skills",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "category",
              "label": "Category",
              "type": "string",
              "required": true
            },
            {
              "name": "items",
              "label": "Skills",
              "type": "string",
              "list": true,
              "default": []
            }
          ]
        },
        {
          "name": "pdf",
          "label": "Downloadable résumé",
          "type": "file",
          "options": {
            "media": "documents"
          },
          "description": "Maximum 10 MiB. Upload separately when updating résumé information."
        },
        {
          "name": "pdfUpdated",
          "label": "PDF last updated",
          "type": "date",
          "default": "",
          "options": {
            "format": "yyyy-MM-dd",
            "time": false
          }
        }
      ]
    }
  ]
}

