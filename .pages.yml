          "label": "Title",
          "type": "string",
          "required": true
        },
        {
          "name": "summary",
          "label": "Short summary",
          "type": "text",
          "required": true
        },
        {
          "name": "published",
          "label": "Publish date",
          "type": "date",
          "required": true,
          "options": {
            "format": "yyyy-MM-dd",
