{
  "media": [
    {
      "name": "images",
      "label": "Images",
      "input": "public/uploads/images",
      "output": "/uploads/images",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "avif"
      ],
      "rename": "safe"
    },
    {
      "name": "documents",
      "label": "Résumé PDFs",
      "input": "public/uploads/documents",
      "output": "/uploads/documents",
      "extensions": [
        "pdf"
      ],
      "rename": "safe"
    }
  ],
  "content": [
    {
      "name": "projects",
      "label": "Projects",
      "type": "collection",
      "path": "src/content/projects",
      "format": "yaml-frontmatter",
      "filename": {
        "template": "{fields.title}.md",
        "field": "create"
      },
      "operations": {
        "create": true,
        "rename": false,
        "delete": false
      },
      "view": {
        "primary": "title",
        "fields": [
          "title",
          "published",
          "draft"
        ],
        "sort": [
          "published",
          "title"
        ]
      },
      "fields": [
        {
          "name": "title",
          "label": "Title",
          "type": "string",
          "required": true
        },
        {
          "name": "summary",
          "label": "Short summary",
          "type": "text",
          "required": true
        },
        {
          "name": "published",
          "label": "Publish date",
          "type": "date",
          "required": true,
          "options": {
            "format": "yyyy-MM-dd",
            "time": false
          }
        },
        {
          "name": "updated",
          "label": "Last updated",
          "type": "date",
          "default": "",
          "options": {
            "format": "yyyy-MM-dd",
            "time": false
          }
        },
        {
          "name": "tags",
          "label": "Tags",
          "type": "string",
          "list": true,
          "default": []
        },
        {
          "name": "cover",
          "label": "Cover image",
          "type": "image",
          "options": {
            "media": "images"
          },
          "description": "JPG, PNG, WebP or AVIF; maximum 2 MiB."
        },
        {
          "name": "coverAlt",
          "label": "Image description",
          "type": "string",
          "description": "Required when a cover image is selected."
        },
        {
          "name": "draft",
          "label": "Keep unpublished",
          "type": "boolean",
          "default": true,
          "description": "Drafts stay off the site, but their files are visible in a public repository."
        },
        {
          "name": "status",
          "label": "Project status",
          "type": "select",
          "required": true,
          "default": "experiment",
          "options": {
            "values": [
              "active",
              "archived",
              "experiment"
            ]
          }
        },
        {
          "name": "featured",
          "label": "Feature on Home",
          "type": "boolean",
          "default": false
        },
        {
          "name": "repository",
          "label": "Source code URL",
          "type": "string"
        },
        {
          "name": "demo",
          "label": "Demo URL",
          "type": "string"
        },
        {
          "name": "body",
          "label": "Content",
          "type": "rich-text",
          "options": {
            "format": "markdown",
            "media": "images"
          },
          "description": "Use Markdown headings, links, lists, code and images. Give images descriptive alt text; raw HTML is not supported."
        }
      ]
    },
    {
